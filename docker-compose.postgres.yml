services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-any_auto_register}
      POSTGRES_USER: ${POSTGRES_USER:-any_auto_register}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-any_auto_register}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-any_auto_register}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
