# 无头服务器部署，配套 ./Dockerfile.server。
#
# 相对 docker-compose.yml 的差异：
#   - 不映射 8317（CLIProxyAPI 插件端口），避免和宿主机上已有的 CLIProxyAPI 抢端口
#   - 不开 Turnstile Solver，也就不需要 8889 和 shm_size
#   - 端口默认只绑 127.0.0.1，由宿主机的反向代理决定要不要对外暴露

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: any-auto-register:server
    container_name: any-auto-register
    init: true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      APP_RELOAD: "0"
      APP_RUNTIME_DIR: /runtime
      APP_ENABLE_SOLVER: "0"
      # 默认 SQLite；设置为 postgresql+psycopg://... 即可使用外部 PostgreSQL
      DATABASE_URL: ${DATABASE_URL:-sqlite:////runtime/account_manager.db}
      # 必须落在挂载卷里，否则每次重建容器都会换密钥，库里的凭据全部作废
      CREDENTIAL_ENCRYPTION_KEY_FILE: /runtime/.secrets/credential_key
      # SQLite must remain a single web process; PostgreSQL supports the 200-worker cap.
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-1}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-30}"
      DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-30}"
      DB_POOL_TIMEOUT: "${DB_POOL_TIMEOUT:-10}"
      SMS_REFUND_ALERT_OLDEST_SECONDS: "${SMS_REFUND_ALERT_OLDEST_SECONDS:-300}"
      SMS_REFUND_ALERT_QUEUE_DEPTH: "${SMS_REFUND_ALERT_QUEUE_DEPTH:-100}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/sms-refunds >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    ports:
      - "${APP_PORT_BIND:-127.0.0.1:8000}:8000"
    volumes:
      - ${APP_RUNTIME_BIND:-./data}:/runtime
